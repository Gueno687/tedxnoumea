<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEDx Nouméa – Toutes les conférences</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
:root {
  --red:    #E50127;
  --black:  #0a0a0a;
  --dark:   #111;
  --gray:   #1e1e1e;
  --mid:    #2a2a2a;
  --light:  #aaa;
  --white:  #fff;
  --gap:    14px;
  --radius: 6px;
  --ease:   cubic-bezier(.4,0,.2,1);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { background: var(--black); color: var(--white); font-family: 'DM Sans', sans-serif; min-height: 100vh; }

/* HEADER */
header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 24px 48px 18px; border-bottom: 1px solid #1c1c1c;
  position: sticky; top: 0; z-index: 100;
  background: rgba(10,10,10,.92); backdrop-filter: blur(10px);
}
.logo img { height: 46px; width: auto; display: block; }
.stats { font-size: .75rem; color: var(--light); letter-spacing: .1em; text-transform: uppercase; }
.stats strong { color: var(--red); }

/* YEAR NAV */
.year-nav {
  display: flex; gap: 8px; padding: 18px 48px 0;
  flex-wrap: wrap;
}
.year-btn {
  background: var(--gray); border: 1px solid #333; color: var(--light);
  font-family: 'Bebas Neue', sans-serif; font-size: 1.1rem; letter-spacing: .06em;
  padding: 6px 18px; border-radius: 30px; cursor: pointer;
  transition: all .25s var(--ease);
}
.year-btn:hover, .year-btn.active { background: var(--red); border-color: var(--red); color: var(--white); }

/* YEAR SECTIONS */
main { padding: 32px 48px 64px; }
.year-section { margin-bottom: 56px; }
.year-section h2 {
  font-family: 'Bebas Neue', sans-serif; font-size: 3.5rem;
  color: var(--red); letter-spacing: .04em; margin-bottom: 20px;
  border-bottom: 1px solid #1e1e1e; padding-bottom: 8px;
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: var(--gap);
}

/* CARD */
.card {
  background: var(--gray); border-radius: var(--radius); overflow: hidden;
  cursor: pointer; position: relative;
  transition: transform .3s var(--ease), box-shadow .3s var(--ease);
  border: 1px solid #2a2a2a;
}
.card:hover { transform: translateY(-4px); box-shadow: 0 16px 40px rgba(0,0,0,.6); }
.card.playing { border-color: var(--red); box-shadow: 0 0 0 2px var(--red); }

/* THUMBNAIL */
.thumb-wrap { position: relative; aspect-ratio: 16/9; background: #111; overflow: hidden; }
.thumb-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .4s var(--ease); }
.card:hover .thumb-wrap img { transform: scale(1.05); }

.play-btn {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  background: rgba(0,0,0,.35); opacity: 0; transition: opacity .25s var(--ease);
}
.card:hover .play-btn { opacity: 1; }
.play-btn svg { width: 48px; height: 48px; fill: rgba(255,255,255,.9); filter: drop-shadow(0 2px 8px rgba(0,0,0,.6)); }

/* IFRAME PLAYER */
.player-wrap { position: relative; aspect-ratio: 16/9; display: none; }
.player-wrap iframe { width: 100%; height: 100%; border: none; display: block; }
.player-close {
  position: absolute; top: 6px; right: 6px; z-index: 2;
  background: rgba(0,0,0,.7); border: none; color: #fff; cursor: pointer;
  width: 28px; height: 28px; border-radius: 50%; font-size: 14px;
  display: flex; align-items: center; justify-content: center;
  transition: background .2s;
}
.player-close:hover { background: var(--red); }

/* CARD INFO */
.card-info { padding: 12px 14px 14px; }
.card-title {
  font-size: .82rem; font-weight: 500; line-height: 1.4;
  color: var(--white); margin-bottom: 6px;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
}
.card-speaker { font-size: .72rem; color: var(--red); font-weight: 500; letter-spacing: .04em; }
.card-loading {
  font-size: .72rem; color: #555; font-style: italic;
}

/* SKELETON */
.skeleton-title, .skeleton-speaker {
  background: linear-gradient(90deg, #222 25%, #2e2e2e 50%, #222 75%);
  background-size: 200% 100%; animation: shimmer 1.4s infinite;
  border-radius: 3px;
}
.skeleton-title { height: 12px; width: 90%; margin-bottom: 6px; }
.skeleton-title:nth-child(2) { width: 70%; }
.skeleton-speaker { height: 10px; width: 50%; margin-top: 4px; }
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

/* RESPONSIVE */
@media (max-width: 768px) {
  header, .year-nav, main { padding-left: 16px; padding-right: 16px; }
  .year-section h2 { font-size: 2.4rem; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
}
</style>
</head>

// ─── UTILITAIRES ─────────────────────────────────────────────────────────────
const THUMB = id => `https://i.ytimg.com/vi/${id}/mqdefault.jpg`;
const YT    = id => `https://www.youtube.com/watch?v=${id}`;

function parseTitle(raw) {
  // Format YouTube TEDx : "Titre de la conf | Prénom Nom | TEDxNouméa"
  // ou "Prénom Nom: Titre | TEDxNouméa"
  if (!raw) return { title: '—', speaker: '—' };
  const parts = raw.split('|').map(s => s.trim());
  if (parts.length >= 3) {
    // Ignorer la partie TEDx (dernière)
    return { title: parts[0], speaker: parts[1] };
  }
  if (parts.length === 2) {
    return { title: parts[0], speaker: parts[1] };
  }
  // Pas de pipe : on prend tout comme titre
  return { title: raw, speaker: '' };
}

// ─── CONSTRUCTION DU DOM ──────────────────────────────────────────────────────
const years = [...new Set(TALKS.map(t => t.year))].sort((a,b) => a-b);
const main  = document.getElementById('main');
const nav   = document.getElementById('year-nav');

document.getElementById('total-count').textContent = TALKS.length;

// Boutons de navigation par année
years.forEach(y => {
  const btn = document.createElement('button');
  btn.className = 'year-btn';
  btn.textContent = y;
  btn.addEventListener('click', () => {
    document.getElementById('year-' + y)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

});

// Sections et cartes
years.forEach(y => {
  const section = document.createElement('section');
  section.className = 'year-section';
  section.id = 'year-' + y;
  section.innerHTML = `<h2>${y}</h2>`;

  const grid = document.createElement('div');
  grid.className = 'grid';

  const yearTalks = TALKS.filter(t => t.year === y);
  yearTalks.forEach(talk => {
    const card = buildCard(talk);
    grid.appendChild(card);
  });

  section.appendChild(grid);
  main.appendChild(section);
});

function buildCard(talk) {
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.id = talk.id;

  card.innerHTML = `
    <div class="thumb-wrap">
      <img src="${THUMB(talk.id)}" alt="Miniature" loading="lazy"
           onerror="this.style.opacity='0.3'">
      <div class="play-btn">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </div>
    </div>
    <div class="player-wrap" id="pw-${talk.id}"></div>
    <div class="card-info">
      <div class="skeleton-title"></div>
      <div class="skeleton-title"></div>
      <div class="skeleton-speaker"></div>
    </div>`;

  card.addEventListener('click', (e) => {
    if (e.target.closest('.player-close')) return;
    togglePlayer(card, talk.id);
  });

  return card;
}

// ─── PLAYER INLINE ───────────────────────────────────────────────────────────
let currentPlayingId = null;

function togglePlayer(card, id) {
  const pw = document.getElementById('pw-' + id);

  // Fermer l'actuel si différent
  if (currentPlayingId && currentPlayingId !== id) {
    const prev = document.querySelector(`.card[data-id="${currentPlayingId}"]`);
    if (prev) closePlayer(prev, currentPlayingId);
  }

  if (card.classList.contains('playing')) {
    closePlayer(card, id);
  } else {
    openPlayer(card, id);
  }
}

function openPlayer(card, id) {
  const pw = document.getElementById('pw-' + id);
  pw.style.display = 'block';
  pw.innerHTML = `
    <iframe src="https://www.youtube.com/embed/${id}?autoplay=1&rel=0"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen></iframe>
    <button class="player-close" onclick="closePlayerById('${id}')" title="Fermer">✕</button>`;
  card.classList.add('playing');
  card.querySelector('.thumb-wrap').style.display = 'none';
  currentPlayingId = id;
}

function closePlayer(card, id) {
  const pw = document.getElementById('pw-' + id);
  pw.style.display = 'none';
  pw.innerHTML = '';
  card.classList.remove('playing');
  card.querySelector('.thumb-wrap').style.display = '';
  if (currentPlayingId === id) currentPlayingId = null;
}

window.closePlayerById = function(id) {
  const card = document.querySelector(`.card[data-id="${id}"]`);
  if (card) closePlayer(card, id);
};

// ─── CHARGEMENT DES MÉTADONNÉES (noembed.com) ────────────────────────────────
let loadedCount = 0;

async function fetchMeta(talk) {
  const url = `https://noembed.com/embed?url=https://www.youtube.com/watch?v=${talk.id}&format=json`;
  try {
    const res  = await fetch(url, { signal: AbortSignal.timeout(8000) });
    const data = await res.json();
    return data.title || null;
  } catch {
    return null;
  }
}

async function loadAllMeta() {
  // Charger par lot de 6 pour ne pas surcharger
  const BATCH = 6;
  for (let i = 0; i < TALKS.length; i += BATCH) {
    const batch = TALKS.slice(i, i + BATCH);
    await Promise.all(batch.map(async talk => {
      const rawTitle = await fetchMeta(talk);
      const card = document.querySelector(`.card[data-id="${talk.id}"]`);
      if (!card) return;
      const info = card.querySelector('.card-info');
      if (rawTitle) {
        const { title, speaker } = parseTitle(rawTitle);
        info.innerHTML = `
          <div class="card-title">${escHtml(title)}</div>
          <div class="card-speaker">${escHtml(speaker)}</div>`;
      } else {
        info.innerHTML = `<div class="card-loading">Titre non disponible</div>`;
      }
      loadedCount++;
      document.getElementById('loaded-count').textContent = loadedCount;
    }));
    // Petite pause entre les lots
    if (i + BATCH < TALKS.length) await sleep(300);
  }
}

function escHtml(s) {
  return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// Démarrer le chargement
loadAllMeta();

// Highlight année active au scroll
const sections = document.querySelectorAll('.year-section');
const btns     = document.querySelectorAll('.year-btn');
const obs = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      const y = e.target.id.replace('year-', '');
      btns.forEach(b => b.classList.toggle('active', b.textContent === y));
    }
  });
}, { threshold: 0.3 });
sections.forEach(s => obs.observe(s));
